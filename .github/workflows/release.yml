name: Release

# Builds release files and opens a DRAFT release. A maintainer reviews the
# draft and publishes it by hand. Two ways to start it:
#   - Actions tab, "Release", "Run workflow" on main. The version comes from
#     package.json; the tag (for example v0.2.0) is created when the draft is published.
#   - Push a tag like v0.2.0 that matches package.json.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately instead of creating a draft
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $TAG"; exit 1
          fi
          # Only published releases have a real tag; unpublished drafts are replaced below.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists. Bump the version in package.json first."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run privacy-scan
      - run: npm run release
      - name: Remove earlier unpublished drafts for this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "Removed draft $id"; done
      - name: Create the release (draft unless publish was chosen)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ inputs.publish && '--latest' || '--draft' }}
        run: |
          gh release create "$TAG" release/* \
            "$MODE" \
            --target "$GITHUB_SHA" \
            --title "Family Continuity Planner $TAG" \
            --notes "Download Family-Continuity-Planner-$TAG.zip, extract it, and open Family-Continuity-Planner.html. See START-HERE.txt inside. This is not a will; we recommend having one alongside it. Prefer not to install anything? Use it online at https://graybound.github.io/family-continuity-planner/. Changes: see CHANGELOG.md."
