name: Release

# Push a tag like v0.2.0 to build release files and open a DRAFT release.
# A maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run privacy-scan
      - run: npm run release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "Family Continuity Planner $GITHUB_REF_NAME" \
            --notes "Download Family-Continuity-Planner-$GITHUB_REF_NAME.zip, extract it, and open Family-Continuity-Planner.html. See START-HERE.txt inside. Changes: see CHANGELOG.md."
