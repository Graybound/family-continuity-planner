name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: Describe the situation, ideally from the point of view of the person writing the plan or the family member reading it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with the project
      options:
        - label: This works without a server, account, or internet connection
        - label: This does not require storing passwords or other secrets
