name: Accessibility problem
description: Something is hard or impossible to use with a keyboard, screen reader, zoom, or other assistive technology.
labels: [accessibility]
body:
  - type: textarea
    id: barrier
    attributes:
      label: What is the barrier?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: Restore dialog, Checklist, printed packet...
  - type: input
    id: tech
    attributes:
      label: Assistive technology, browser, and operating system
      placeholder: NVDA 2026.1, Firefox, Windows 11
