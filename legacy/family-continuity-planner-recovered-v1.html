(function(){'use strict';

const ICONS={dashboard:'⌂',people:'♙',contacts:'☎',health:'✚',home:'⌁',accounts:'▣',documents:'▤',plans:'◇',checklist:'✓',notes:'✎',settings:'⚙'};
const NAV=[['dashboard','Overview'],['people','People'],['contacts','Key contacts'],['health','Health'],['home','Home and utilities'],['accounts','Accounts'],['documents','Documents'],['plans','Emergency plans'],['checklist','Checklist'],['notes','Notes'],['settings','Settings']];
const SCHEMAS={
people:{title:'People',singular:'person',description:'Who is part of the household and what do helpers need to know?',icon:'♙',fields:[{k:'name',label:'Full name',required:true,wide:true},{k:'relationship',label:'Relationship or role'},{k:'phone',label:'Phone',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'address',label:'Address',wide:true,private:true},{k:'needs',label:'Care or communication needs',type:'textarea',wide:true},{k:'notes',label:'Important notes',type:'textarea',wide:true}]},
contacts:{title:'Key contacts',singular:'contact',description:'Trusted people and services to call when normal routines break.',icon:'☎',fields:[{k:'name',label:'Contact or organization',required:true,wide:true},{k:'role',label:'Role'},{k:'priority',label:'Priority',type:'select',options:['Primary','Backup','Service']},{k:'phone',label:'Phone',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'instructions',label:'When to contact',type:'textarea',wide:true}]},
health:{title:'Health',singular:'health record',description:'Care instructions, providers, medications, allergies, and insurance details.',icon:'✚',fields:[{k:'person',label:'Person',required:true},{k:'recordType',label:'Record type',type:'select',options:['Medication','Allergy','Provider','Insurance','Care instruction'],required:true},{k:'name',label:'Name or item',required:true,wide:true},{k:'details',label:'Details',wide:true,private:true},{k:'phone',label:'Provider phone',type:'tel'},{k:'instructions',label:'Instructions',type:'textarea',wide:true,private:true}]},
home:{title:'Home and utilities',singular:'home record',description:'How to access, protect, and operate the places your family depends on.',icon:'⌁',fields:[{k:'name',label:'Utility, property, or service',required:true,wide:true},{k:'type',label:'Type',type:'select',options:['Electric','Gas','Water','Internet','Security','Property','Vehicle','Other']},{k:'provider',label:'Provider or owner'},{k:'account',label:'Account or identifier',private:true},{k:'phone',label:'Emergency phone',type:'tel'},{k:'location',label:'Shutoff, key, or access location',wide:true,private:true},{k:'instructions',label:'Operating instructions',type:'textarea',wide:true}]},
accounts:{title:'Accounts',singular:'account',description:'A locator for essential accounts. Do not store passwords.',icon:'▣',private:true,fields:[{k:'name',label:'Institution or service',required:true,wide:true},{k:'type',label:'Type',type:'select',options:['Banking','Insurance','Retirement','Mortgage or rent','Utilities','Digital','Subscription','Other']},{k:'owner',label:'Owner'},{k:'identifier',label:'Last four digits or safe hint',private:true},{k:'website',label:'Website or app name'},{k:'phone',label:'Support phone',type:'tel'},{k:'access',label:'Where access instructions are stored',wide:true,private:true},{k:'notes',label:'Continuity notes',type:'textarea',wide:true,private:true}]},
documents:{title:'Documents',singular:'document',description:'Track where critical records are stored and when they need attention.',icon:'▤',fields:[{k:'name',label:'Document',required:true,wide:true},{k:'category',label:'Category',type:'select',options:['Identity','Legal','Financial','Insurance','Property','Medical','Other']},{k:'owner',label:'Owner or covered person'},{k:'location',label:'Physical or digital location',required:true,wide:true,private:true},{k:'expires',label:'Expiration or review date',type:'date'},{k:'notes',label:'Notes',type:'textarea',wide:true,private:true}]},
plans:{title:'Emergency plans',singular:'plan',description:'Simple, ordered instructions for moments when clear thinking is hardest.',icon:'◇',fields:[{k:'name',label:'Plan name',required:true,wide:true},{k:'trigger',label:'When to use this plan',required:true,wide:true},{k:'lead',label:'Primary lead'},{k:'backup',label:'Backup lead'},{k:'meetup',label:'Meeting point',wide:true,private:true},{k:'steps',label:'Steps, one per line',type:'textarea',required:true,wide:true},{k:'reviewed',label:'Last reviewed',type:'date'}]},

const STARTER=[{id:uid(),group:'First 24 hours',title:'Choose two trusted backup contacts',note:'Confirm how they should be reached.',due:'',done:false},{id:uid(),group:'Information to gather',title:'Record utility shutoff locations',note:'Include any tool needed to operate them.',due:'',done:false},{id:uid(),group:'People to brief',title:'Walk one trusted person through the plan',note:'Show them where the current backup is stored.',due:'',done:false},{id:uid(),group:'Quarterly upkeep',title:'Export an updated backup',note:'Keep an offline copy somewhere protected.',due:'',done:false}];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function clone(v){return JSON.parse(JSON.stringify(v))}
function blank(){return{version:APP_VERSION,meta:{householdName:'',region:'',meetup:'',trustedContact:'',updatedAt:new Date().toISOString(),createdAt:new Date().toISOString(),includePrivatePrint:false,privacyDefault:false},people:[],contacts:[],health:[],home:[],accounts:[],documents:[],plans:[],notes:[],checklist:clone(STARTER),activity:[]}}
function migrate(s){const b=blank();if(!s||typeof s!=='object')return b;Object.keys(b).forEach(k=>{if(s[k]!==undefined)b[k]=s[k]});Object.keys(SCHEMAS).forEach(k=>{if(!Array.isArray(b[k]))b[k]=[]});if(!Array.isArray(b.checklist))b.checklist=clone(STARTER);b.meta=Object.assign(blank().meta,s.meta||{});return b}
function load(){try{return migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return blank()}}
let state=load(),current='dashboard',editing=null,privacy=!!state.meta.privacyDefault,filterText='',filterType='all';const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(v+'T12:00:00')):'';
function toast(m,e=false){const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2600)}function save(m){state.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(m)toast(m)}catch(e){toast('Could not save. Export a backup now.',true)}}function log(t){state.activity.unshift({id:uid(),text:t,at:new Date().toISOString()});state.activity=state.activity.slice(0,30)}
function theme(){return document.documentElement.dataset.theme==='light'?'light':'dark'}function applyTheme(t,announce=false){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;try{localStorage.setItem(THEME_KEY,t)}catch(e){}const b=$('#themeBtn'),light=t==='light';b.textContent=light?'☾':'☀';const tip=document.createElement('span');tip.className='tooltip';tip.id='themeTip';tip.textContent=light?'Use dark mode':'Use light mode';b.appendChild(tip);b.setAttribute('aria-label',tip.textContent);b.setAttribute('aria-pressed',String(!light));if(announce)toast(light?'Light mode enabled':'Dark mode enabled')}
function navCount(k){return SCHEMAS[k]?state[k].length:k==='checklist'?state.checklist.filter(x=>!x.done).length:''}function renderNav(){$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="nav-btn ${current===k?'active':''}" data-view="${k}" ${current===k?'aria-current="page"':''}><span class="icon">${ICONS[k]}</span><span>${l}</span>${navCount(k)!==''?`<span class="nav-count">${navCount(k)}</span>`:''}</button>`).join('')}
function complete(){const c={people:state.people.length>=1,contacts:state.contacts.length>=2,health:state.health.length>=1,home:state.home.length>=2,accounts:state.accounts.length>=2,documents:state.documents.length>=2,plans:state.plans.length>=1,checklist:state.checklist.length>0&&state.checklist.filter(x=>x.done).length/state.checklist.length>=.5},w={people:12,contacts:14,health:12,home:12,accounts:12,documents:14,plans:14,checklist:10};return{c,score:Object.keys(c).reduce((n,k)=>n+(c[k]?w[k]:0),0)}}
function pageHead(k){const s=SCHEMAS[k];return`<div class="page-head"><div><p class="eyebrow">Continuity record</p><h1>${s.title}</h1><p>${s.description}</p><div class="updated">Saved locally</div></div><div class="page-actions"><button class="btn primary" data-add="${k}">Add ${s.singular}</button></div></div>`}
function dashboard(){const r=complete(),name=state.meta.householdName?esc(state.meta.householdName):'your family',sections=[['people','People',1,'#4b94bb'],['contacts','Key contacts',2,'#e77a49'],['health','Health',1,'#bd6f70'],['home','Home and utilities',2,'#7fa06f'],['accounts','Accounts',2,'#987fbd'],['documents','Documents',2,'#d59a3b'],['plans','Emergency plans',1,'#42a2a0'],['checklist','Checklist',Math.max(state.checklist.length,1),'#7791a0']];const next=sections.filter(x=>!r.c[x[0]]).slice(0,3);return`<section class="view active"><div class="hero"><div><p class="eyebrow" style="color:#ffad88">A plan people can actually use</p><h1>Keep ${name} moving when life changes fast.</h1><p>Gather the people, instructions, and locations a trusted helper would need. Everything stays in this browser until you export it.</p><div class="hero-actions"><button class="btn signal" data-next>${next.length?'Continue the plan':'Review the plan'}</button><button class="btn" data-export>Export backup</button></div></div><div class="readiness" aria-label="Plan readiness ${r.score} percent"><div class="ring" style="--score:${r.score}"></div><div class="score"><strong>${r.score}%</strong><span>plan readiness</span></div></div></div><div class="section-title"><h2>Continuity map</h2><p>Each rail marks one part of the handoff.</p></div><div class="grid grid-four">${sections.map(x=>{const n=x[0]==='checklist'?state.checklist.filter(i=>i.done).length:state[x[0]].length,p=Math.min(100,Math.round(n/x[2]*100));return`<button class="card progress-card" data-go="${x[0]}" style="--rail:${x[3]}"><div><h3>${x[1]}</h3><p>${n} saved, ${x[2]} recommended to start</p><div class="bar"><i style="width:${p}%"></i></div></div><div class="progress-num">${p}%</div></button>`}).join('')}</div><div class="grid two"><div><div class="section-title"><h2>Best next steps</h2></div><div class="card card-pad"><div class="alert-list">${next.length?next.map(x=>`<button class="alert" data-go="${x[0]}" style="border:0;width:100%;text-align:left"><span class="alert-icon">${ICONS[x[0]]}</span><span><strong>Add ${x[1].toLowerCase()}</strong><p>Build the minimum handoff for this section.</p></span></button>`).join(''):'<div class="alert"><span class="alert-icon">✓</span><span><strong>Your foundation is in place</strong><p>Review records and export a fresh backup.</p></span></div>'}</div></div></div><div><div class="section-title"><h2>Continuity risks</h2></div><div class="card card-pad"><div class="alert-list">${next.map(x=>`<div class="alert"><span class="alert-icon">!</span><span><strong>${x[1]} needs attention</strong><p>No usable handoff has been recorded yet.</p></span></div>`).join('')||'<div class="empty"><strong>No major gaps detected</strong><span>Keep the plan current with regular reviews.</span></div>'}</div></div></div></div></section>`}
function recordCard(k,r){const s=SCHEMAS[k],title=r.name||r.person||'Untitled',sub=r.relationship||r.role||r.recordType||r.type||r.category||s.singular,show=s.fields.filter(f=>!['name','person','relationship','role','recordType','type','category'].includes(f.k)&&r[f.k]).slice(0,4);return`<article class="card record"><button class="record-menu" aria-label="Edit ${esc(title)}" data-edit="${k}:${r.id}">•••</button><div class="record-top"><div class="record-icon">${s.icon}</div><div><h3>${esc(title)}</h3><div class="record-sub">${esc(sub||s.singular)}</div></div></div><div class="record-data">${show.map(f=>`<div class="datum ${f.wide?'wide':''}"><label>${f.label}</label><div class="${f.private?'sensitive-text':''}">${f.type==='date'?fmt(r[f.k]):esc(r[f.k])}</div></div>`).join('')}</div></article>`}
function moduleView(k){const s=SCHEMAS[k];let items=state[k];if(filterText){const q=filterText.toLowerCase();items=items.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))}const sf=s.fields.find(f=>f.type==='select');if(filterType!=='all'&&sf)items=items.filter(r=>r[sf.k]===filterType);return`<section class="view active">${pageHead(k)}${k==='accounts'?'<div class="callout"><strong>Store a locator, not a secret</strong><p>Do not save passwords, PINs, full card numbers, or recovery codes here.</p></div>':''}<div class="summary-strip"><div class="summary-item"><span>Total records</span><strong>${state[k].length}</strong></div><div class="summary-item"><span>With phone</span><strong>${state[k].filter(x=>x.phone).length}</strong></div><div class="summary-item"><span>Dated reviews</span><strong>${state[k].filter(x=>x.expires||x.reviewed).length}</strong></div><div class="summary-item"><span>Status</span><strong>${state[k].length?'Active':'Start'}</strong></div></div><div class="tool-row"><input class="filter" id="recordFilter" value="${esc(filterText)}" placeholder="Filter ${s.title.toLowerCase()}">${sf?`<select class="filter" id="typeFilter"><option value="all">All types</option>${sf.options.map(o=>`<option ${filterType===o?'selected':''}>${o}</option>`).join('')}</select>`:''}<span class="result-count">${items.length} result${items.length===1?'':'s'}</span></div>${items.length?`<div class="records">${items.map(r=>recordCard(k,r)).join('')}</div>`:`<div class="card empty"><div class="empty-icon">${s.icon}</div><strong>Nothing recorded yet</strong><span>Add the first ${s.singular} to start this section.</span><div style="margin-top:14px"><button class="btn primary" data-add="${k}">Add ${s.singular}</button></div></div>`}</section>`}
function checklist(){const groups=['First 24 hours','Information to gather','People to brief','Quarterly upkeep'];return`<section class="view active"><div class="page-head"><div><p class="eyebrow">Action list</p><h1>Checklist</h1><p>Turn the plan into small, visible actions.</p></div><div class="page-actions"><button class="btn primary" data-add-check>Add item</button></div></div><div class="check-groups">${groups.map(g=>{const xs=state.checklist.filter(x=>x.group===g),done=xs.filter(x=>x.done).length;return`<section class="card check-group"><div class="check-head"><div class="record-icon">✓</div><div><h3>${g}</h3><span>${done} of ${xs.length} complete</span></div><div class="check-progress">${xs.length?Math.round(done/xs.length*100):0}%</div></div><div class="check-items">${xs.map(x=>`<label class="check-item ${x.done?'done':''}"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span class="check-label"><strong>${esc(x.title)}</strong><small>${esc(x.note)}</small></span><span>${x.due?`<span class="due">${fmt(x.due)}</span>`:''}<button class="mini-delete" data-delete-check="${x.id}" aria-label="Delete ${esc(x.title)}">×</button></span></label>`).join('')||'<div class="empty">No items in this group.</div>'}</div></section>`}).join('')}</div></section>`}
function settings(){return`<section class="view active"><div class="page-head"><div><p class="eyebrow">Control center</p><h1>Settings and backup</h1><p>Name the plan, control privacy, appearance, and backups.</p></div></div><div class="settings-grid"><div class="card setting-card"><h3>Planner identity</h3><p>These details appear on the overview and printed packet.</p><div class="form-grid"><div class="field full"><label>Household or plan name</label><input id="householdName" value="${esc(state.meta.householdName)}"></div><div class="field"><label>Home city or region</label><input id="region" value="${esc(state.meta.region)}"></div><div class="field"><label>Primary trusted contact</label><input id="trustedContact" value="${esc(state.meta.trustedContact)}"></div></div><div style="margin-top:16px"><button class="btn primary" id="saveSettings">Save details</button></div></div><div class="card setting-card"><h3>Appearance</h3><p>Dark mode is the default. Your choice stays on this device.</p><div class="setting-row"><div><strong>Dark mode</strong><small>Reduce glare and use the darker planner palette.</small></div><label class="switch"><input id="settingsTheme" type="checkbox" ${theme()==='dark'?'checked':''}><span class="slider"></span></label></div><div class="setting-row"><div><strong>Start in privacy mode</strong><small>Blur marked details when the planner opens.</small></div><label class="switch"><input id="privacyDefault" type="checkbox" ${state.meta.privacyDefault?'checked':''}><span class="slider"></span></label></div></div><div class="card setting-card"><h3>Backup and restore</h3><p>Keep a protected copy outside this browser.</p><div class="setting-row"><div><strong>Export JSON backup</strong><small>Download a complete portable copy.</small></div><button class="btn" data-export>Export</button></div><div class="setting-row"><div><strong>Restore JSON backup</strong><small>Replace this planner with a prior export.</small></div><button class="btn" id="restoreBackup">Restore</button></div><div class="setting-row"><div><strong>Print handoff packet</strong><small>Print or save a readable light copy.</small></div><button class="btn" data-print>Print</button></div></div></div></section>`}
function render(){document.body.classList.toggle('privacy-on',privacy);$('#privacyBtn').setAttribute('aria-pressed',String(privacy));renderNav();$('#views').innerHTML=current==='dashboard'?dashboard():current==='checklist'?checklist():current==='settings'?settings():moduleView(current);bind()}
function go(k){current=k;filterText='';filterType='all';render();scrollTo({top:0,behavior:'smooth'});closeMenu()}
function bind(){$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-add]').forEach(b=>b.onclick=()=>openRecord(b.dataset.add));$$('[data-edit]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.edit.split(':');openRecord(k,id)});$$('[data-export]').forEach(b=>b.onclick=exportData);$$('[data-print]').forEach(b=>b.onclick=printData);$$('[data-add-check]').forEach(b=>b.onclick=()=>{$('#checkForm').reset();$('#checkDialog').showModal()});$$('[data-check]').forEach(x=>x.onchange=()=>{const i=state.checklist.find(a=>a.id===x.dataset.check);i.done=x.checked;save('Checklist updated');render()});$$('[data-delete-check]').forEach(b=>b.onclick=e=>{e.preventDefault();if(confirm('Delete this checklist item?')){state.checklist=state.checklist.filter(x=>x.id!==b.dataset.deleteCheck);save('Checklist item deleted');render()}});const f=$('#recordFilter');if(f)f.oninput=()=>{filterText=f.value;render();const n=$('#recordFilter');n.focus();n.setSelectionRange(filterText.length,filterText.length)};const tf=$('#typeFilter');if(tf)tf.onchange=()=>{filterType=tf.value;render()};const n=$('[data-next]');if(n)n.onclick=()=>{const r=complete(),order=['people','contacts','health','home','accounts','documents','plans','checklist'];go(order.find(k=>!r.c[k])||'settings')};const ss=$('#saveSettings');if(ss)ss.onclick=()=>{state.meta.householdName=$('#householdName').value.trim();state.meta.region=$('#region').value.trim();state.meta.trustedContact=$('#trustedContact').value.trim();save('Settings saved');render()};const st=$('#settingsTheme');if(st)st.onchange=()=>applyTheme(st.checked?'dark':'light',true);const pd=$('#privacyDefault');if(pd)pd.onchange=()=>{state.meta.privacyDefault=pd.checked;save()};const rb=$('#restoreBackup');if(rb)rb.onclick=()=>$('#importFile').click()}
function openRecord(k,id=null){const s=SCHEMAS[k],r=id?state[k].find(x=>x.id===id):{};editing={k,id};$('#dialogTitle').textContent=(id?'Edit ':'Add ')+s.singular;$('#dialogSubtitle').textContent=s.description;$('#formFields').innerHTML=s.fields.map(f=>{const val=r?.[f.k]||'',attrs=`name="${f.k}" ${f.required?'required':''}`;let input=f.type==='textarea'?`<textarea ${attrs}>${esc(val)}</textarea>`:f.type==='select'?`<select ${attrs}><option value="">Choose</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="${f.type||'text'}" value="${esc(val)}" ${attrs}>`;return`<div class="field ${f.wide?'full':''}"><label>${f.label}${f.required?' *':''}</label>${input}${f.private?'<span class="help">Marked private and hidden in privacy mode.</span>':''}</div>`}).join('');$('#deleteRecordBtn').hidden=!id;$('#recordDialog').showModal()}
$('#recordForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),o={id:editing.id||uid()};SCHEMAS[editing.k].fields.forEach(f=>o[f.k]=String(fd.get(f.k)||'').trim());if(editing.id)state[editing.k][state[editing.k].findIndex(x=>x.id===editing.id)]=o;else state[editing.k].push(o);log((editing.id?'Updated ':'Added ')+SCHEMAS[editing.k].singular);save('Record saved');$('#recordDialog').close();render()};$('#deleteRecordBtn').onclick=()=>{if(editing?.id&&confirm('Delete this record?')){state[editing.k]=state[editing.k].filter(x=>x.id!==editing.id);save('Record deleted');$('#recordDialog').close();render()}};
$('#checkForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.checklist.push({id:uid(),title:String(f.get('title')),group:String(f.get('group')),due:String(f.get('due')),note:String(f.get('note')),done:false});save('Checklist item added');$('#checkDialog').close();render()};
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!data.meta||!Array.isArray(data.checklist))throw new Error();state=migrate(data);save('Backup restored');go('dashboard')}catch(err){toast('That file is not a valid Family Continuity backup',true)}e.target.value=''};
function exportData(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='family-continuity-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('Backup exported')}
function printData(){const populated=Object.keys(SCHEMAS).filter(k=>state[k].length);$('#printPacket').innerHTML=`<header class="print-title"><h1>${esc(state.meta.householdName||'Family Continuity Plan')}</h1><p>Updated ${new Date(state.meta.updatedAt).toLocaleDateString()}</p></header>`+populated.map(k=>`<section class="print-section"><h2>${SCHEMAS[k].title}</h2>${state[k].map(r=>`<article class="print-record"><strong>${esc(r.name||r.person||'Record')}</strong><dl>${SCHEMAS[k].fields.filter(f=>r[f.k]&&!f.private).map(f=>`<dt>${f.label}</dt><dd>${esc(r[f.k])}</dd>`).join('')}</dl></article>`).join('')}</section>`).join('');print()}
function searchRows(){const a=[];Object.keys(SCHEMAS).forEach(k=>state[k].forEach(r=>a.push({k,id:r.id,title:r.name||r.person||'Record',sub:SCHEMAS[k].title,text:Object.values(r).join(' ').toLowerCase(),icon:SCHEMAS[k].icon})));return a}function renderSearch(q){const a=searchRows().filter(x=>!q||x.text.includes(q.toLowerCase())).slice(0,30);$('#searchResults').innerHTML=a.length?a.map(x=>`<button class="search-result" data-open="${x.k}:${x.id}"><span class="record-icon">${x.icon}</span><span><strong>${esc(x.title)}</strong><small>${x.sub}</small></span><span>›</span></button>`).join(''):'<div class="empty"><strong>No matches</strong><span>Try another search.</span></div>';$$('[data-open]').forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.open.split(':');$('#searchDialog').close();go(k);setTimeout(()=>openRecord(k,id),0)})}
function closeMenu(){$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show')}$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#mobileOverlay').classList.add('show')};$('#mobileOverlay').onclick=closeMenu;$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)};$('#themeBtn').onclick=()=>applyTheme(theme()==='dark'?'light':'dark',true);$('#privacyBtn').onclick=()=>{privacy=!privacy;render();toast(privacy?'Private details hidden':'Private details visible')};$('#backupBtn').onclick=exportData;$('#printBtn').onclick=printData;$('#searchBtn').onclick=()=>{$('#searchDialog').showModal();renderSearch('');setTimeout(()=>$('#searchInput').focus(),20)};$('#searchInput').oninput=e=>renderSearch(e.target.value);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#searchDialog').open)$('#searchBtn').click()}if(e.key==='Escape')closeMenu()});applyTheme(theme());render();
})();
</script></body></html>
